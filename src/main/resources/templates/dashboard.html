<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumy's Premium Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #881337; border-radius: 4px; }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

    <header class="bg-rose-950 text-white shadow-xl sticky top-0 z-50 border-b-4 border-rose-800">
        <div class="max-w-7xl mx-auto p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-4xl">☕</span>
                <div>
                    <h1 class="text-3xl font-black tracking-wider uppercase text-rose-50">Soumy's Cafe</h1>
                    <p class="text-rose-300 text-xs font-bold tracking-widest uppercase mt-1">Premium Roasters & Kitchen</p>
                </div>
            </div>
            <button onclick="document.getElementById('cart-section').scrollIntoView({behavior: 'smooth'})" 
                    class="bg-rose-700 hover:bg-rose-600 px-6 py-3 rounded-full font-bold transition shadow-lg flex items-center gap-2 border border-rose-500">
                <span>🛒</span> 
                <span>Cart (<span id="cart-count">0</span>)</span>
            </button>
        </div>
    </header>

    <div class="relative w-full h-80 bg-stone-900 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=1200&q=80" alt="Cafe Interior" class="w-full h-full object-cover opacity-50">
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white text-center px-4">
            <h2 class="text-5xl font-black tracking-tight mb-4 drop-shadow-lg">Handcrafted for You.</h2>
            <p class="text-xl font-medium text-rose-100 drop-shadow-md">Experience the finest blends and gourmet bites.</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-10 mt-6 relative">
        
        <div class="lg:col-span-2 space-y-12" id="menu-container">
            <div class="text-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-rose-900 mx-auto"></div>
                <p class="mt-4 text-stone-500 font-bold tracking-widest uppercase">Preparing the Menu...</p>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-3xl shadow-2xl border border-stone-200 sticky top-32" id="cart-section">
                <h2 class="text-2xl font-black tracking-tight border-b-2 border-stone-100 pb-4 mb-4 text-stone-800 flex items-center gap-2">
                    <span>🧾</span> Your Order
                </h2>
                
                <ul id="cart-items" class="space-y-4 mb-6 text-stone-600 max-h-60 overflow-y-auto pr-2">
                    <li class="italic text-center text-stone-400 py-4">Your cart is empty.</li>
                </ul>

                <div class="border-t-2 border-dashed border-stone-200 pt-4 mb-6">
                    <div class="flex justify-between font-black text-2xl text-rose-950">
                        <span>Total:</span>
                        <span>₹<span id="checkout-total">0</span></span>
                    </div>
                </div>

                <button onclick="submitOrder()" id="checkout-btn" class="w-full bg-rose-700 hover:bg-rose-800 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-rose-900/20 disabled:bg-stone-300 disabled:shadow-none disabled:cursor-not-allowed text-lg tracking-wide" disabled>
                    Proceed to Checkout
                </button>
                <div id="order-status" class="mt-4 text-center font-bold hidden p-3 rounded-lg text-sm"></div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        window.onload = () => {
            fetch('/api/cafe/menu')
                .then(response => response.json())
                .then(data => renderMenu(data))
                .catch(err => document.getElementById('menu-container').innerHTML = '<p class="text-red-500 font-bold">Failed to load menu. Ensure the Java server is running.</p>');
        };

        function renderMenu(menuData) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ''; 

            for (const [category, items] of Object.entries(menuData)) {
                let sectionHTML = `
                    <div class="mb-10">
                        <div class="flex items-center gap-4 mb-8">
                            <h2 class="text-3xl font-black text-rose-950 uppercase tracking-tight">${category}</h2>
                            <div class="h-1 flex-grow bg-stone-200 rounded-full"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                `;

                items.forEach(item => {
                    const safeName = item.name.replace(/'/g, "\\'");
                    sectionHTML += `
                        <div class="bg-white rounded-3xl shadow-lg border border-stone-100 overflow-hidden hover:shadow-2xl transition duration-300 group flex flex-col">
                            <div class="h-56 w-full overflow-hidden bg-stone-200">
                                <img src="${item.imageUrl}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-black text-stone-800 leading-tight">${item.name}</h3>
                                </div>
                                <p class="text-stone-500 text-sm mb-6 flex-grow leading-relaxed">${item.description}</p>
                                <div class="flex justify-between items-center mt-auto pt-4 border-t border-stone-100">
                                    <span class="text-2xl font-black text-rose-800">₹${item.price}</span>
                                    <button onclick="addToCart('${safeName}', ${item.price})" class="bg-rose-100 text-rose-800 hover:bg-rose-800 hover:text-white font-bold py-2 px-6 rounded-full transition duration-200 shadow-sm">
                                        + Add
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsList = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const checkoutTotal = document.getElementById('checkout-total');
            const checkoutBtn = document.getElementById('checkout-btn');

            cartCount.innerText = cart.length;
            
            let total = 0;
            if (cart.length === 0) {
                cartItemsList.innerHTML = '<li class="italic text-center text-stone-400 py-4">Your cart is empty.</li>';
                checkoutBtn.disabled = true;
            } else {
                cartItemsList.innerHTML = '';
                cart.forEach((item, index) => {
                    total += item.price;
                    cartItemsList.innerHTML += `
                        <div class="flex justify-between items-center p-3 hover:bg-stone-50 rounded-xl transition">
                            <span class="font-bold text-stone-700">${item.name}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-rose-800 font-bold">₹${item.price}</span>
                                <button onclick="removeFromCart(${index})" class="bg-stone-200 hover:bg-red-500 hover:text-white text-stone-500 h-8 w-8 rounded-full font-bold flex items-center justify-center transition">✕</button>
                            </div>
                        </div>
                    `;
                });
                checkoutBtn.disabled = false;
            }
            
            checkoutTotal.innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function submitOrder() {
            const statusText = document.getElementById('order-status');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            checkoutBtn.innerText = "Transmitting to Kitchen...";
            checkoutBtn.disabled = true;

            fetch('/api/cafe/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart, total: document.getElementById('checkout-total').innerText })
            })
            .then(response => response.json())
            .then(data => {
                cart = [];
                updateCartUI();
                statusText.innerHTML = "🎉 <strong>Success!</strong> " + data.message;
                statusText.className = "mt-4 text-center font-bold block p-3 rounded-lg text-sm bg-green-100 text-green-800 border border-green-200";
                checkoutBtn.innerText = "Proceed to Checkout";
            })
            .catch(error => {
                statusText.innerHTML = "⚠️ <strong>Connection Error.</strong> Please try again.";
                statusText.className = "mt-4 text-center font-bold block p-3 rounded-lg text-sm bg-red-100 text-red-800 border border-red-200";
                checkoutBtn.innerText = "Proceed to Checkout";
                checkoutBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
