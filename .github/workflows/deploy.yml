name: CI/CD Pipeline for Java App

on:
  push:
    paths-ignore:
      - 'main.tf'
      - '.github/workflows/terraform.yml' #which tells it to run for Java code, but ignore Terraform files

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub provides a temporary Linux server

    steps:
      # 1. Get your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java 21 on the GitHub server
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build the JAR file
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # 4. Log in to your Docker Hub account securely
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: soumya903/java-app:latest
      # 1. Log into AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 2. Fetch the IP from the Vault and save it as an environment variable
      - name: Get EC2 IP from AWS SSM
        id: get-ip
        run: |
          EC2_IP=$(aws ssm get-parameter --name "/java-app/production/ec2-public-ip" --query "Parameter.Value" --output text)
          echo "EC2_HOST=$EC2_IP" >> $GITHUB_ENV    

      # 6. Log into EC2, pull the new image, and run it
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu # CHANGE TO 'ec2-user' IF USING AMAZON LINUX INSTEAD OF UBUNTU
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-app:latest
            sudo docker stop my-java-app || true
            sudo docker rm my-java-app || true
            sudo docker run -d --name my-java-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/java-app:latest