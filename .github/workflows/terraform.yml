name: 'Terraform Infrastructure Pipeline'

on:
  push:
    branches: [ "main" ] # This tells GitHub to run this pipeline every time you push to the main branch

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code from your GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install Terraform on the GitHub runner
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 3. Log into AWS securely using the secrets you just saved!
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    # 4. Initialize Terraform (and connect to the S3 bucket we made)
    - name: Terraform Init
      run: terraform init

    # 5. See what changes need to be made
    - name: Terraform Plan
      run: terraform plan

    # 6. Build the infrastructure! (-auto-approve means it won't wait for you to type 'yes')
    - name: Terraform Apply
      run: terraform apply -auto-approve